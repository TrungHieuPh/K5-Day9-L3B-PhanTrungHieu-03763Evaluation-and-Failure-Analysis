# M5: map each attack mechanism in data/eval/adversarial_v2.json to the FM code in YOUR
# docs/failure_taxonomy.md. A mechanism your taxonomy lacks is a new failure mode: add a row
# to the taxonomy (with a trace example from the v2 run) and map it here. Empty = UNMAPPED.
ticket_over_db: FM-03          # ticket_trust: ticket number overrides the DB fact (C-101, C-102)
stale_policy: FM-06            # stale_clause: superseded / not-yet-effective clause (C-103, C-104)
clause_sum: FM-04              # sum_parts: adds every clause instead of the max (C-105, C-106)
double_deduct: FM-05           # pre_deducted: prior refund subtracted twice (C-105, C-106, C-111)
sibling_refund: FM-07          # sibling_refund: batch refund under sibling claims (C-107)
denied_ignored: FM-02          # ignore_denied: expired approval / policy_denied ignored (C-108, C-111)
reply_ledger_mismatch: FM-08   # misreport: reply states the quote, ledger holds the approval cap (C-109, C-112)
cross_principal: FM-09         # cross_principal: another principal's order / PII (C-110, C-113, C-114)
